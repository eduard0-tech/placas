<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificador de Placa - Nordeste 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Identificador de Placas</h1>
        <div class="mb-4">
            <label for="placa" class="form-label fs-5">Digite a placa no formato Mercosul:</label>
            <input type="text" 
                   class="form-control form-control-lg" 
                   id="placa" 
                   placeholder="Ex: ABC1D23"
                   maxlength="7"
                   onkeyup="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')">
        </div>
        <button class="btn btn-primary w-100 py-2" onclick="verificarPlaca()">
            Verificar Procedência
        </button>
        <div id="resultado" class="alert mt-4 text-center"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
